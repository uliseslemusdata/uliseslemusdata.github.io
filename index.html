<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ulises Lemus — Data Analyst</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F4F2;
      --white: #FFFFFF;
      --ink: #111111;
      --ink-mid: #444444;
      --ink-dim: #888888;
      --border: #E0DFDC;
      --tag-bg: #EFEFED;
      --accent: #C8521A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'EB Garamond', serif;
      font-size: 18px;
      line-height: 1.6;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      border-bottom: 1px solid var(--border);
    }

    .nav-name {
      font-family: 'EB Garamond', serif;
      font-size: 18px;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 300;
      color: var(--ink-dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--ink); }

    .hero {
      padding: 72px 48px 64px;
      max-width: 960px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s both;
    }

    .hero h1 {
      font-family: 'EB Garamond', serif;
      font-size: clamp(52px, 7vw, 84px);
      font-weight: 400;
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .hero-desc {
      font-size: 20px;
      color: var(--ink-mid);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      color: var(--ink-mid);
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 12px;
    }

    .btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 3px;
      border: 1px solid var(--border);
      color: var(--ink);
      background: transparent;
      transition: all 0.2s;
      display: inline-block;
    }

    .btn:hover {
      background: var(--ink);
      color: var(--white);
      border-color: var(--ink);
    }

    .skills {
      padding: 80px 48px;
      border-top: 1px solid var(--border);
    }

    .skills-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: var(--ink-dim);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .skills h2 {
      font-family: 'EB Garamond', serif;
      font-size: 40px;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .skills-subtitle {
      font-size: 17px;
      color: var(--ink-mid);
      max-width: 560px;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .skill-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .skill-column-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--ink);
      text-transform: uppercase;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 10px;
      margin-bottom: 4px;
    }

    .skill-project {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      text-decoration: none;
      display: block;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .skill-project:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .skill-project-title {
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .skill-project-desc {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      color: var(--ink-dim);
      line-height: 1.5;
    }

    .flagship {
      padding: 20px 48px 80px;
    }

    .flagship-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .flagship h2 {
      font-family: 'EB Garamond', serif;
      font-size: 32px;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 32px;
      line-height: 1.1;
    }

    .flagship-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .flagship-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 6px;
      padding: 24px 26px;
      text-decoration: none;
      display: block;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .flagship-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .flagship-card-category {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--ink-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .flagship-card-title {
      font-family: 'EB Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .flagship-card-desc {
      font-size: 15px;
      color: var(--ink-dim);
